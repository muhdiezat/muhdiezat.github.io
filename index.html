<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Izzat Zulnaidi | Link Produk</title>
<meta name="description" content="Barang yang Izzat guna dan review. Tekan untuk beli terus di TikTok Shop.">
<meta property="og:title" content="Izzat Zulnaidi | Link Produk">
<meta property="og:description" content="Barang yang aku guna dan review. Tekan untuk beli.">
<meta property="og:image" content="img/mageasy-thumb.jpg">
<meta name="theme-color" content="#15123D">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #15123D;
    --yellow: #FFD400;
    --pink: #E8114F;
    --cream: #FFFCF2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--navy);
    color: var(--cream);
    font-family: "Montserrat", system-ui, sans-serif;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 460px; margin: 0 auto; padding: 32px 16px 48px; }

  /* Header */
  header { text-align: center; margin-bottom: 28px; }
  .avatar {
    width: 92px; height: 92px; border-radius: 50%;
    margin: 0 auto 14px;
    background: var(--yellow) url("img/dp.jpg") center/cover;
    border: 4px solid var(--yellow);
    box-shadow: 4px 4px 0 var(--pink);
  }
  h1 { font-weight: 900; font-size: 26px; letter-spacing: .5px; text-transform: uppercase; }
  .handle { font-weight: 600; font-size: 14px; opacity: .75; margin-top: 4px; }
  .tagline {
    display: inline-block; margin-top: 14px;
    background: var(--pink); color: var(--cream);
    font-weight: 900; font-size: 13px; text-transform: uppercase; letter-spacing: .5px;
    padding: 6px 12px; border-radius: 6px;
    transform: rotate(-2deg);
    box-shadow: 3px 3px 0 #000;
  }

  /* Product rows: collapsed shows the name only, tap to reveal photo + button */
  .item {
    background: var(--cream); color: var(--navy);
    border-radius: 14px; overflow: hidden;
    border: 3px solid var(--navy);
    box-shadow: 5px 5px 0 var(--yellow);
    margin-bottom: 16px;
  }
  .item summary {
    list-style: none; cursor: pointer;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 16px 16px;
    font-weight: 900; font-size: 17px; text-transform: uppercase; letter-spacing: .3px;
  }
  .item summary::-webkit-details-marker { display: none; }
  .chev {
    flex: none; width: 30px; height: 30px; border-radius: 50%;
    background: var(--yellow); display: grid; place-items: center;
    transition: transform .2s;
  }
  .chev svg { width: 16px; height: 16px; }
  .item[open] .chev { transform: rotate(180deg); background: var(--pink); color: var(--cream); }
  .item .reveal { padding: 0 14px 16px; }
  .item img {
    display: block; width: 100%; aspect-ratio: 9 / 16; object-fit: cover;
    border-radius: 10px; border: 3px solid var(--navy);
  }
  .btn {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    margin-top: 14px; padding: 15px 16px;
    background: var(--yellow); color: var(--navy);
    font-weight: 900; font-size: 16px; text-transform: uppercase; letter-spacing: .5px;
    text-decoration: none; border-radius: 12px;
    border: 3px solid var(--navy);
    box-shadow: 4px 4px 0 var(--navy);
    transition: transform .08s, box-shadow .08s;
  }
  .reveal > .btn:first-child { margin-top: 0; }
  .btn:active { transform: translate(3px, 3px); box-shadow: 1px 1px 0 var(--navy); }
  .btn svg { width: 20px; height: 20px; flex: none; }

  /* Simple link rows */
  .link {
    display: block; text-align: center;
    padding: 14px 16px; margin-bottom: 12px;
    background: transparent; color: var(--cream);
    border: 3px solid var(--cream); border-radius: 12px;
    font-weight: 800; font-size: 15px; text-transform: uppercase; letter-spacing: .5px;
    text-decoration: none;
  }
  .link:active { background: var(--cream); color: var(--navy); }
  .section-title {
    font-weight: 900; font-size: 13px; text-transform: uppercase; letter-spacing: 1px;
    color: var(--yellow); margin: 0 0 12px;
  }
  #products { margin-bottom: 26px; }
  footer { text-align: center; font-size: 11px; font-weight: 600; opacity: .5; margin-top: 28px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="avatar" role="img" aria-label="Izzat Zulnaidi"></div>
    <h1>Izzat Zulnaidi</h1>
    <div class="handle">@izzatzulnaidi</div>
    <div class="tagline">Barang yang aku guna sendiri</div>
  </header>

  <p class="section-title">Produk</p>
  <main id="products"></main>

  <p class="section-title">Tonton review</p>
  <a class="link" href="https://www.tiktok.com/@izzatzulnaidi" target="_blank" rel="noopener">TikTok @izzatzulnaidi</a>

  <footer>Tekan butang kuning untuk beli terus di TikTok Shop</footer>
</div>

<script>
  // Add a new product: copy one object below and change the fields.
  const PRODUCTS = [
    {
      name: "Mageasy Lanyard Charger",
      image: "img/mageasy-thumb.jpg",
      url: "https://vt.tiktok.com/ZS9yRFujaddtR-KOnbv/",
    },
    {
      name: "Rak Penyangkut Baju",
      image: "img/rak-baju.jpg",
      url: "https://vt.tiktok.com/ZS9yRYAh24Tpp-ZXHSX/",
    },
    {
      name: "Alumu Phone Cover",
      image: "", // no cover yet: card shows the button only
      url: "https://vt.tiktok.com/ZS9y9YnUw9JYf-5u77P/",
    },
  ];

  const bag = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>';
  const chev = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  const list = document.getElementById("products");
  list.innerHTML = PRODUCTS.map(p => `
    <details class="item">
      <summary>${esc(p.name)}<span class="chev">${chev}</span></summary>
      <div class="reveal">
        ${p.image ? `<a href="${esc(p.url)}" target="_blank" rel="noopener"><img src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy"></a>` : ""}
        <a class="btn" href="${esc(p.url)}" target="_blank" rel="noopener">${bag}Beli di TikTok Shop</a>
      </div>
    </details>`).join("");

  // Only one product open at a time.
  list.querySelectorAll("details").forEach(d => d.addEventListener("toggle", () => {
    if (d.open) list.querySelectorAll("details[open]").forEach(o => { if (o !== d) o.open = false; });
  }));
</script>
</body>
</html>
